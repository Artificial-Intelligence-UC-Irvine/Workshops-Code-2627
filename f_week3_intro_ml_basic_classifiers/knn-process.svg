<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><style>text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:26px;font-weight:700}.label{font-size:18px}.small{font-size:15px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.arrow{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="450" y="35" text-anchor="middle" class="title">How K-Nearest Neighbors makes a prediction</text><rect class="box" x="35" y="75" width="180" height="110"/><text x="125" y="112" text-anchor="middle" class="label">1. New sample</text><circle cx="125" cy="145" r="10" fill="#7c3aed"/><text x="125" y="174" text-anchor="middle" class="small">unknown label</text><line class="arrow" x1="215" y1="130" x2="275" y2="130"/><rect class="box" x="280" y="75" width="200" height="110"/><text x="380" y="108" text-anchor="middle" class="label">2. Measure distance</text><circle cx="345" cy="147" r="8" fill="#2563eb"/><circle cx="380" cy="130" r="8" fill="#dc2626"/><circle cx="417" cy="153" r="8" fill="#2563eb"/><circle cx="380" cy="145" r="7" fill="#7c3aed"/><text x="380" y="174" text-anchor="middle" class="small">find nearby points</text><line class="arrow" x1="480" y1="130" x2="540" y2="130"/><rect class="box" x="545" y="75" width="150" height="110"/><text x="620" y="108" text-anchor="middle" class="label">3. Keep k</text><text x="620" y="138" text-anchor="middle" class="label">nearest</text><text x="620" y="169" text-anchor="middle" class="small">e.g. k = 5</text><line class="arrow" x1="695" y1="130" x2="750" y2="130"/><rect class="box" x="755" y="75" width="115" height="110"/><text x="812" y="112" text-anchor="middle" class="label">4. Vote</text><text x="812" y="145" text-anchor="middle" class="small">majority label</text><text x="812" y="170" text-anchor="middle" class="small">= prediction</text></svg>